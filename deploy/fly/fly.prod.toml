# Fly.io deployment config for the production fleet.
# See README.md beside this file for deployment, scaling and recovery procedures.
# Each fleet config is independent; inspect its values rather than assuming parity.
#
# Secrets: DISCORD_TOKEN, CLIENT_ID, DATABASE_URL, DIAGNOSTICS_TOKEN;
# AVC_AI_API_KEY optionally enables /templateassistant.
# Give this fleet its own WATCHDOG_PING_URL so another fleet cannot mask an outage.
# Use the Postgres direct endpoint for LISTEN/NOTIFY and session advisory locks.
#
# Prod is the sole billing advancer for the shared database. Other fleets must
# keep billing.advance_disabled=true: the cluster reservation applies its winner's
# fleet-local policy to shared customers.
# Prod owns scheduled backups and restore drills. Their advisory locks are per
# fleet, so other fleets must omit backup credentials or disable BOTH jobs.
# Only this fleet may carry TOPGG_TOKEN for the production listing: the token
# chooses the listing, while published counts come from the sending fleet.
app = "avc-prod"

# Allow in-flight work to drain and release leases, without waiting indefinitely
# for retryable background work. Shutdown handles both SIGINT and SIGTERM.
kill_timeout = "30s"

# Keep database round trips and gateway WebSocket latency low.
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SELF_HOSTED = "false"
  FLEET = "prod"
  HTTP_PORT = "8080"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  # Changing TOTAL_SHARDS requires a full fleet stop/start, not a rolling deploy.
  # Size for cache memory and gateway load as well as Discord's shard limit.
  TOTAL_SHARDS = "4"
  # Claim cap per machine is ceil(TOTAL_SHARDS / EXPECTED_INSTANCES).
  EXPECTED_INSTANCES = "4"
  # Leave room outside the V8 heap for native allocations and stacks.
  NODE_OPTIONS = "--max-old-space-size=1700"
  AVC_AI_BASE_URL = "https://api.openai.com/v1"
  AVC_AI_MODEL = "gpt-5.4-mini"
  # Spend estimates: update these with the model's prices when changing models.
  AVC_AI_PRICE_INPUT_PER_MTOK = "0.75"
  AVC_AI_PRICE_OUTPUT_PER_MTOK = "4.50"
  # Supporter roles are recognition, never entitlement. Only one fleet may manage
  # these roles: two writers would overwrite each other's decisions.
  SUPPORT_GUILD_ID = "601015720200896512"
  # Keys follow envKeyForSupporterRole. Existing role members retain membership
  # when a role is renamed, so audit holders before changing a role's meaning.
  SUPPORT_ROLE_S = "1542449852992987146"          # Uncommon
  SUPPORT_ROLE_M = "1542450265217695834"          # Rare
  SUPPORT_ROLE_EPIC = "1542450335056928788"       # Epic
  SUPPORT_ROLE_LEGENDARY = "1546805917880680468"  # Legendary
  SUPPORT_ROLE_MYTHIC = "1542450395371020320"     # Mythic
  # Exotic has no catalogue price and is badged manually. Keep it mapped so the
  # role synchronizer knows the full set of roles it manages.
  SUPPORT_ROLE_EXOTIC = "1542450467349594163"     # Exotic
  # The bot needs Manage Roles and a role above every managed role. Verify
  # /diagnostics -> supporterRoles.unusableRoles after configuration changes.

[deploy]
  strategy = "rolling"

[[restart]]
  policy = "on-failure"
  max_retries = 10

# Leave INSTANCE_ID unset: config uses Fly's unique per-machine FLY_MACHINE_ID.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  # Dedicated CPU preserves headroom for boot/reconnect bursts and presence load.
  # Re-evaluate peak demand and throttling before changing the machine class.
  size = "performance-1x"
  memory = "2gb"
