# Fly.io deployment config for the gold fleet.
# See README.md beside this file for deployment, scaling and recovery procedures.
# Each fleet config is independent; inspect its values rather than assuming parity.
#
# Secrets: DISCORD_TOKEN, CLIENT_ID, DATABASE_URL, DIAGNOSTICS_TOKEN;
# AVC_AI_API_KEY optionally enables /templateassistant.
# Use the Postgres direct endpoint for LISTEN/NOTIFY and session advisory locks.
# Give this fleet its own WATCHDOG_PING_URL: a heartbeat from another fleet cannot
# prove this one is alive, and a one-shard fleet has no healthy peer when it fails.
# AI usage is shared across fleets; ai.monthly_budget_usd compares cluster usage
# against this fleet's threshold, not an isolated per-fleet spend total.
#
# Gold must keep billing.advance_disabled=true. Prod alone advances shared
# customer billing; the cluster reservation applies its winner's fleet-local policy.
# Omit backup credentials, SUPPORT_* and TOPGG_TOKEN here. Prod owns scheduled
# backups/drills, the shared supporter roles and the production listing.
# Backup election is per fleet: configuring another owner duplicates database
# backups and can make two drills compete for one scratch database.
# If backup credentials are retained, set BOTH backup.disabled and
# backup.drill_disabled to true.
app = "avc-gold"

# Allow in-flight work to drain and release leases, without waiting indefinitely
# for retryable background work. Shutdown handles both SIGINT and SIGTERM.
kill_timeout = "30s"

# Keep database round trips and gateway WebSocket latency low.
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SELF_HOSTED = "false"
  FLEET = "gold"
  HTTP_PORT = "8080"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  # Changing TOTAL_SHARDS requires a full fleet stop/start, not a rolling deploy.
  # Size for member/presence cache memory as well as Discord's shard limit.
  TOTAL_SHARDS = "1"
  # Claim cap per machine is ceil(TOTAL_SHARDS / EXPECTED_INSTANCES).
  EXPECTED_INSTANCES = "1"
  # Leave room outside the V8 heap for native allocations and stacks.
  NODE_OPTIONS = "--max-old-space-size=1700"
  AVC_AI_BASE_URL = "https://api.openai.com/v1"
  AVC_AI_MODEL = "gpt-5.4-mini"
  # Spend estimates: update these with the model's prices when changing models.
  AVC_AI_PRICE_INPUT_PER_MTOK = "0.75"
  AVC_AI_PRICE_OUTPUT_PER_MTOK = "4.50"

[deploy]
  # A single-machine fleet has no serving peer during replacement. Verify its
  # health and shard ownership explicitly after each deployment.
  strategy = "rolling"

[[restart]]
  policy = "on-failure"
  max_retries = 10

# Leave INSTANCE_ID unset: config uses Fly's unique per-machine FLY_MACHINE_ID.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  # Dedicated CPU preserves headroom for boot/reconnect bursts and presence load.
  # Re-evaluate peak demand and throttling before changing the machine class.
  size = "performance-1x"
  memory = "2gb"
