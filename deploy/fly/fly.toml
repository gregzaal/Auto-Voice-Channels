# Fly.io deployment config for the hosted bot service.
# The application is deployment-agnostic; everything Fly-specific lives here so
# the app never hard-depends on Fly. Self-host uses docker-compose instead.
#
# Secrets (set via `fly secrets set ...`, never committed):
#   DISCORD_TOKEN, CLIENT_ID, DATABASE_URL
#   AVC_AI_API_KEY  (optional: enables /templateassistant; without it the
#                    command is not registered at all)
#
# `avc-beta` is the app that becomes the beta fleet. Renamed from `avc-dev` on
# 2026-08-18: Fly app names are the hostname and cannot be changed in place, so
# the rename was a new app plus a secret copy. `avc-dev` was a testing artifact
# of a name for something that will serve real users, and the kind of name that
# eventually gets treated as disposable.
#
# It runs AVC Beta (675405085752164372) as FLEET = "beta" since the beta switch
# on 2026-08-19 (plans/fleets.md 7.1), which swapped out the private testbed bot
# (Lohner, 701117810549588038) and flipped the fleet in the same deploy, on
# purpose: a restart that changed one without the other would have brought AVC
# Beta up reading production's runtime flags and claiming production's shard
# leases. **Flipping FLEET without re-seeding runtime_flags for the new fleet
# silently reverts every flag to its code default** - the table is keyed
# (fleet, key), and the beta rows were seeded before this deploy. Production
# gets its own app, `avc-prod`, at the cutover.
app = "avc-beta"
# `iad` is deliberate, and it is about Discord's gateway, not convenience.
# Measured 2026-08-19 from a machine in each region:
#
#                                iad      ams
#   gateway open -> HELLO      38.5ms   134.1ms   <- the real Discord node
#   REST /api/v10/gateway      14.1ms    14.9ms   <- anycast edge, tells you nothing
#
# The bot sits ~96ms closer to Discord here. That is what a user feels: gateway
# latency is paid on every voice event.
#
# **The database was moved to `iad` on 2026-08-19 to match** (cluster `avc-iad`,
# `w86750817gqr3pk4`). It was in `ams`, which cost 91.2ms per round trip, and
# the join path is NOT cache-served the way guild settings are: three
# sequential reads before a room can be created, measured at 273ms in `ams` and
# 16ms now. The earlier claim in this file that the hot path does not read
# Postgres was wrong; only `guilds.settings` is cached.
#
# `avc-web` in `ams` now pays that distance instead. That is the correct side to
# put it on: a dashboard page is request/response and tolerant, a gamer waiting
# for a voice channel is not.
#
# **Do not "fix" this by moving the app to ams.** The REST numbers above make
# the two regions look equivalent and they are not: REST terminates at a
# Cloudflare anycast edge, the gateway WebSocket does not.
#
# **DATABASE_URL must point at `direct.<cluster>.flympg.net`, NOT `pgbouncer.`**
#
# The newer Managed Postgres generation (the one `avc-iad` runs, distinguishable
# by its `_pgbouncer` role where the old cluster has `_crunchypgbouncer`) resets
# `search_path` to EMPTY on every pooled session. `pg_settings` reports the
# source as `session`, so no `ALTER ROLE` or `ALTER DATABASE` can override it,
# and both of those are refused to `fly-user` anyway.
#
# With an empty search_path every unqualified query fails with "relation does
# not exist", so the bot would boot into a total outage. It is worse than a
# plain failure while operating: `drop table if exists ops_audit` resolves to
# nothing, reports `DROP TABLE`, and drops nothing, which is how this was found.
#
# The direct endpoint has the normal `"$user", public` default, is a stable DNS
# name (not the raw 6PN address), and gives 100 max_connections against the ~24
# this deployment uses at peak. Losing pgbouncer costs nothing here and removes
# the pooler that caused the `statement_timeout` startup-parameter trap in
# AGENTS.md.
#
# There is no in-place region change and no read replica in MPG as of
# 2026-08-19, so any future move is a new cluster plus a restore. Our own
# backup CLI does that independently of Fly's tooling
# (`node core/dist/backup/cli.js restore --to postgres://...`).
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SELF_HOSTED = "false"
  # Which hosted fleet this app is (plans/fleets.md). REQUIRED whenever
  # SELF_HOSTED=false: the process refuses to boot without it, deliberately,
  # because a hosted instance that silently defaulted to "prod" would let the
  # beta bot claim production's shard leases and read production's runtime
  # flags.
  FLEET = "beta"
  HTTP_PORT = "8080"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  # TOTAL_SHARDS is a managed value; set per scale.
  TOTAL_SHARDS = "1"
  # Fleet size: each instance claims up to ceil(TOTAL_SHARDS / EXPECTED_INSTANCES)
  # shards. Keep this in sync with the running machine count so shards spread
  # evenly (and a replacement machine reliably re-claims a dead peer's share).
  EXPECTED_INSTANCES = "1"
  # Keep the next memory failure legible.
  #
  # At 512mb V8 sized its heap below the container limit, so the OOM on
  # 2026-08-19 arrived as a clean "Reached heap limit Allocation failed" in the
  # log. At 2gb the auto-sized cap can sit at or above the container limit, and
  # the failure becomes a kernel OOM-kill: exit 137, no JS stack, nothing in the
  # log explaining it. Capping the heap below the container keeps V8 the thing
  # that reports the problem.
  #
  # Not a fix for growth. The member and presence caches are unbounded by
  # design (rewrite.md decision 12) and `shared-cpu-1x` tops out at 2gb, so the
  # next raise is a VM-class change. See fleets.md 7.2.
  NODE_OPTIONS = "--max-old-space-size=1700"
  # AI-assisted templates. The endpoint and model are plain config; only the key
  # is a secret. Free on every tier and never entitlement-gated — the only limit
  # is the uniform per-guild monthly cap, tunable live via `runtime_flags`
  # (`ai.builds_per_month`, `ai.builds_notice_threshold`, `ai.monthly_budget_usd`).
  AVC_AI_BASE_URL = "https://api.openai.com/v1"
  AVC_AI_MODEL = "gpt-5.4-mini"
  # Used only to estimate spend against the fleet-wide ceiling. Keep in step with
  # the model's list prices if the model changes.
  AVC_AI_PRICE_INPUT_PER_MTOK = "0.75"
  AVC_AI_PRICE_OUTPUT_PER_MTOK = "4.50"

# Rolling deploys with a health gate. Identifies are serialized cluster-wide by
# the Postgres-backed throttler, so concurrent re-identifies on deploy are safe.
[deploy]
  strategy = "rolling"

# Orchestrator-driven failover: restart a machine that exits unexpectedly (crash
# or a lease-loss exit) so it re-claims its shards on boot. Fly replaces machines
# during deploys separately; this governs unexpected exits.
[[restart]]
  policy = "on-failure"
  max_retries = 10

# INSTANCE_ID must be unique per machine (shard-lease identity). We do NOT set it
# here — config falls back to Fly's per-machine FLY_MACHINE_ID when INSTANCE_ID is
# unset, so each machine gets a distinct, stable id automatically.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  # `performance-1x` is a DEDICATED core, and the "1x" is misleading: it is not
  # one step up from shared-cpu-1x, it is ~16x the CPU that machine actually
  # gets. Changed 2026-08-20 to end a fleet-wide outage, and the mechanism is
  # worth understanding before anyone sizes this back down to save money.
  #
  # A `shared-cpu-Nx` machine has a BASELINE entitlement (1x is ~6.25% of a
  # physical core, 2x ~12.5%, 4x ~25%) plus a burst balance that accrues while
  # it runs under baseline and drains while it runs over. Exhaust the balance
  # and the host pins you at baseline, reporting the difference to the guest as
  # CPU **steal**. Measured on the day: 92-93% steal, sustained, with the guest
  # never once idle.
  #
  # Nothing crashes when that happens, which is what makes it hard to read. The
  # process is starved, not broken, so every deadline that is wall-clock rather
  # than CPU-bound blows at once and each one looks like its own bug: the
  # Discord heartbeat ACK went to 9407ms against a normal 16ms, `pg` reported
  # "timeout exceeded when trying to connect" and "Connection terminated
  # unexpectedly", the lease heartbeat and the sweep failed, and /health missed
  # its 2s timeout often enough that Fly flapped the service up and down for an
  # hour. The pg errors in particular read exactly like the idle-socket incident
  # earlier the same day (fixed in d62c069) and were a red herring.
  #
  # Measured steady-state demand once unthrottled: **5-7.4% of a core**, which
  # is to say it sat almost exactly ON the 6.25% baseline. That is the whole
  # story. It was never comfortably inside its entitlement, so every transient
  # spent balance it could not earn back, and it survived for weeks on a
  # slowly-draining battery before the evening peak finished it.
  #
  # So: do not size this by steady-state demand. Boot and reconnect catch-up
  # measured **18-48%**, 3-8x the steady state, and a reconnect is routine (any
  # deploy, any gateway resume). shared-cpu-4x would cover the average and still
  # drain on every restart. A dedicated core removes the failure mode rather
  # than moving the cliff, and this is the one machine serving 1009 guilds.
  size = "performance-1x"
  # 2GB, raised from 512mb at the beta switch on 2026-08-19. It is also
  # performance-1x's base memory, so the resize did not change it.
  #
  # 512mb was sized for the Lohner testbed's three guilds. The beta fleet
  # inherited 1004, and the first boot on that identity died with
  # "Reached heap limit Allocation failed" four times before it got through.
  #
  # The cost is decision 12 in plans/rewrite.md: message and reaction caches
  # are off, but guild, channel, voice-state, member AND presence caches are
  # kept, because the game-name templates read member.presence. That is a
  # deliberate trade of memory for a feature, and it means memory scales with
  # the member count of the install base, not the guild count. Size the node
  # up rather than scoping the cache down.
  memory = "2gb"
