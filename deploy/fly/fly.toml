# Fly.io deployment config for the beta fleet.
# The bot is deployment-agnostic; self-hosters use docker-compose.yml.
# See README.md beside this file for deployment, scaling and recovery procedures.
#
# Secrets: DISCORD_TOKEN, CLIENT_ID, DATABASE_URL, DIAGNOSTICS_TOKEN;
# AVC_AI_API_KEY optionally enables /templateassistant.
# Give this fleet its own WATCHDOG_PING_URL so another fleet cannot mask an outage.
# Use the Postgres direct endpoint: LISTEN/NOTIFY and session advisory locks
# require a persistent session, which a transaction pooler cannot provide.
#
# FLEET selects lease ownership and runtime flags. When changing it, prepare the
# destination fleet's flags first: missing rows use code defaults.
# Beta must keep billing.advance_disabled=true. The billing reservation is
# cluster-wide, but its winner applies that fleet's policy to shared customers.
# Prod owns scheduled backups/drills. If backup credentials remain on beta, keep
# BOTH backup.disabled=true and backup.drill_disabled=true; election is per fleet.
app = "avc-beta"

# Allow graceful drain to release leases after in-flight work. Keep this bounded:
# an interrupted backup can retry, while an unbounded drain stalls deployment.
# Shutdown handles both SIGINT and SIGTERM.
kill_timeout = "30s"

# Place the bot near both its database and Discord's gateway. Channel reads hit
# Postgres; REST edge latency alone does not measure gateway WebSocket latency.
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SELF_HOSTED = "false"
  # Required for hosted operation so a missing value cannot select prod ownership.
  FLEET = "beta"
  HTTP_PORT = "8080"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  # Changing TOTAL_SHARDS requires a full fleet stop/start, not a rolling deploy.
  TOTAL_SHARDS = "2"
  # Each machine claims up to ceil(TOTAL_SHARDS / EXPECTED_INSTANCES) shards.
  # Keep this aligned with intended machine count; multiple shards per machine work.
  EXPECTED_INSTANCES = "1"
  # Leave container headroom for native allocations and stacks. A V8 heap error is
  # more diagnosable than a kernel OOM kill, but this is not a cap on total RSS.
  NODE_OPTIONS = "--max-old-space-size=1700"
  # Only the key is secret. Per-guild caps and the shared usage ceiling are
  # runtime flags; paid entitlement does not gate the template assistant.
  AVC_AI_BASE_URL = "https://api.openai.com/v1"
  AVC_AI_MODEL = "gpt-5.4-mini"
  # Spend estimates: update these with the model's prices when changing models.
  AVC_AI_PRICE_INPUT_PER_MTOK = "0.75"
  AVC_AI_PRICE_OUTPUT_PER_MTOK = "4.50"

# Health checks gate rolling updates; inspect every machine after deployment.
[deploy]
  strategy = "rolling"

# Failover relies on a replacement/restarted process claiming leases at boot.
[[restart]]
  policy = "on-failure"
  max_retries = 10

# Leave INSTANCE_ID unset: config uses Fly's unique per-machine FLY_MACHINE_ID.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  # Size for reconnect/boot bursts as well as steady load. Shared-CPU throttling
  # can delay gateway heartbeats, DB work and lease renewal together.
  size = "performance-1x"
  # Member/presence caches support game-name templates; memory scales with member
  # population. Measure peak RSS and retain headroom when changing this value.
  memory = "2gb"
