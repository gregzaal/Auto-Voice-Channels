# Fly.io deployment config for the hosted bot service.
# The application is deployment-agnostic; everything Fly-specific lives here so
# the app never hard-depends on Fly. Self-host uses docker-compose instead.
#
# Secrets (set via `fly secrets set ...`, never committed):
#   DISCORD_TOKEN, CLIENT_ID, DATABASE_URL
#   AVC_AI_API_KEY  (optional: enables /templateassistant; without it the
#                    command is not registered at all)
#
# `avc-beta` is the app that becomes the beta fleet. Renamed from `avc-dev` on
# 2026-08-18: Fly app names are the hostname and cannot be changed in place, so
# the rename was a new app plus a secret copy. `avc-dev` was a testing artifact
# of a name for something that will serve real users, and the kind of name that
# eventually gets treated as disposable.
#
# It runs AVC Beta (675405085752164372) as FLEET = "beta" since the beta switch
# on 2026-08-19 (plans/fleets.md 7.1), which swapped out the private testbed bot
# (Lohner, 701117810549588038) and flipped the fleet in the same deploy, on
# purpose: a restart that changed one without the other would have brought AVC
# Beta up reading production's runtime flags and claiming production's shard
# leases. **Flipping FLEET without re-seeding runtime_flags for the new fleet
# silently reverts every flag to its code default** - the table is keyed
# (fleet, key), and the beta rows were seeded before this deploy. Production
# gets its own app, `avc-prod`, at the cutover.
app = "avc-beta"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SELF_HOSTED = "false"
  # Which hosted fleet this app is (plans/fleets.md). REQUIRED whenever
  # SELF_HOSTED=false: the process refuses to boot without it, deliberately,
  # because a hosted instance that silently defaulted to "prod" would let the
  # beta bot claim production's shard leases and read production's runtime
  # flags.
  FLEET = "beta"
  HTTP_PORT = "8080"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  # TOTAL_SHARDS is a managed value; set per scale.
  TOTAL_SHARDS = "1"
  # Fleet size: each instance claims up to ceil(TOTAL_SHARDS / EXPECTED_INSTANCES)
  # shards. Keep this in sync with the running machine count so shards spread
  # evenly (and a replacement machine reliably re-claims a dead peer's share).
  EXPECTED_INSTANCES = "1"
  # Keep the next memory failure legible.
  #
  # At 512mb V8 sized its heap below the container limit, so the OOM on
  # 2026-08-19 arrived as a clean "Reached heap limit Allocation failed" in the
  # log. At 2gb the auto-sized cap can sit at or above the container limit, and
  # the failure becomes a kernel OOM-kill: exit 137, no JS stack, nothing in the
  # log explaining it. Capping the heap below the container keeps V8 the thing
  # that reports the problem.
  #
  # Not a fix for growth. The member and presence caches are unbounded by
  # design (rewrite.md decision 12) and `shared-cpu-1x` tops out at 2gb, so the
  # next raise is a VM-class change. See fleets.md 7.2.
  NODE_OPTIONS = "--max-old-space-size=1700"
  # AI-assisted templates. The endpoint and model are plain config; only the key
  # is a secret. Free on every tier and never entitlement-gated — the only limit
  # is the uniform per-guild monthly cap, tunable live via `runtime_flags`
  # (`ai.builds_per_month`, `ai.builds_notice_threshold`, `ai.monthly_budget_usd`).
  AVC_AI_BASE_URL = "https://api.openai.com/v1"
  AVC_AI_MODEL = "gpt-5.4-mini"
  # Used only to estimate spend against the fleet-wide ceiling. Keep in step with
  # the model's list prices if the model changes.
  AVC_AI_PRICE_INPUT_PER_MTOK = "0.75"
  AVC_AI_PRICE_OUTPUT_PER_MTOK = "4.50"

# Rolling deploys with a health gate. Identifies are serialized cluster-wide by
# the Postgres-backed throttler, so concurrent re-identifies on deploy are safe.
[deploy]
  strategy = "rolling"

# Orchestrator-driven failover: restart a machine that exits unexpectedly (crash
# or a lease-loss exit) so it re-claims its shards on boot. Fly replaces machines
# during deploys separately; this governs unexpected exits.
[[restart]]
  policy = "on-failure"
  max_retries = 10

# INSTANCE_ID must be unique per machine (shard-lease identity). We do NOT set it
# here — config falls back to Fly's per-machine FLY_MACHINE_ID when INSTANCE_ID is
# unset, so each machine gets a distinct, stable id automatically.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  # 2GB, raised from 512mb at the beta switch on 2026-08-19.
  #
  # 512mb was sized for the Lohner testbed's three guilds. The beta fleet
  # inherited 1004, and the first boot on that identity died with
  # "Reached heap limit Allocation failed" four times before it got through.
  #
  # The cost is decision 12 in plans/rewrite.md: message and reaction caches
  # are off, but guild, channel, voice-state, member AND presence caches are
  # kept, because the game-name templates read member.presence. That is a
  # deliberate trade of memory for a feature, and it means memory scales with
  # the member count of the install base, not the guild count. Size the node
  # up rather than scoping the cache down.
  memory = "2gb"
