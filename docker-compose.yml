# Self-host: bot + Postgres. `docker compose up` and you're running.
# The same image is used for the scaled hosted service (Fly); only config differs.
services:
  postgres:
    # Pinned by digest for reproducible builds (tag: postgres:16-alpine).
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d avc']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # Pass the whole of `.env` through, rather than naming keys here. Naming them
    # meant every optional key had to be repeated in two files, and the list had
    # already drifted: ADMIN_CHANNEL_ID and DIAGNOSTICS_TOKEN are documented in
    # `.env.example`, and setting either of them did nothing at all under the one
    # command the README tells you to run.
    env_file:
      - .env
    environment:
      # Only the values compose itself has to decide. These override `.env`.
      # Inside the compose network Postgres answers to `postgres`, not localhost.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/avc
      # The container always serves on 8080; the host port is the mapping below.
      HTTP_PORT: '8080'
      INSTANCE_ID: selfhost
      NODE_ENV: production
      # SELF_HOSTED defaults to true, so self-hosting needs nothing here.
    ports:
      # Host port kept uncommon to avoid clashing with other local services
      # (8080 is a common conflict). Container still serves on 8080.
      - '8477:8080'
    restart: unless-stopped

volumes:
  pgdata:
