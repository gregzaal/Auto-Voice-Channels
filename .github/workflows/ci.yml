name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # GitHub-hosted Ubuntu runners include a working Docker daemon, which
    # Testcontainers needs for the DB / LISTEN-NOTIFY / advisory-lock tests.
    steps:
      - uses: actions/checkout@v4

      # pg_dump / pg_restore for the backup round-trip test. The runtime image
      # installs its own (Dockerfile), but the integration suite runs on the
      # runner. Pinned to 16 to match the server the tests boot; a client older
      # than the server refuses the dump outright, and the test would then skip
      # silently rather than fail, which is the worst outcome for a backup test.
      - name: PostgreSQL client (for the backup round trip)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Hard gates — all must pass before merge/deploy.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint + format check
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # `tsc` emits only JS, and the Docker runtime stage copies `bot/dist`
      # alone, so a runtime asset that misses the copy step ships a container
      # that dies on boot. Cheap to assert, expensive to find in production.
      - name: Runtime assets present in dist
        run: test -f bot/dist/features/templateAssistant/systemPrompt.md

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests (Testcontainers)
        run: pnpm run test:integration
