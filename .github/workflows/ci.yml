name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # GitHub-hosted Ubuntu runners include a working Docker daemon, which
    # Testcontainers needs for the DB / LISTEN-NOTIFY / advisory-lock tests.
    steps:
      - uses: actions/checkout@v4

      # pg_dump / pg_restore for the backup round-trip test. The runtime image
      # installs its own (Dockerfile), but the integration suite runs on the
      # runner. Pinned to 16 to match the server the tests boot; a client older
      # than the server refuses the dump outright, and the test would then skip
      # silently rather than fail, which is the worst outcome for a backup test.
      # Only installs when the runner does not already carry a new enough client.
      # The first version of this step added the PGDG apt repo unconditionally
      # and piped a key through `gpg --dearmor -o`, which prompts to overwrite an
      # existing file and then waits for input that never comes. It hung for ten
      # minutes before being cancelled. Everything here is now non-interactive,
      # bounded by a timeout, and skipped entirely when it is not needed.
      - name: PostgreSQL client (for the backup round trip)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          have=$(pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo 0)
          if [ "${have:-0}" -ge 16 ]; then
            echo "pg_dump $have already present, skipping install"
          else
            sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc               | sudo gpg --batch --yes --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client-16
          fi
          pg_dump --version
          pg_restore --version

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Hard gates — all must pass before merge/deploy.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint + format check
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # `tsc` emits only JS, and the Docker runtime stage copies `bot/dist`
      # alone, so a runtime asset that misses the copy step ships a container
      # that dies on boot. Cheap to assert, expensive to find in production.
      - name: Runtime assets present in dist
        run: test -f bot/dist/features/templateAssistant/systemPrompt.md

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests (Testcontainers)
        run: pnpm run test:integration
